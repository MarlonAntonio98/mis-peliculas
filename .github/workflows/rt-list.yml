name: Actualizar lista de Rotten Tomatoes

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 rt_list.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add rt-top300.json
          git diff --cached --quiet || (git commit -m "Actualizar lista de Rotten Tomatoes" && git push)
